<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="dashboard-token" content="__TOKEN__"><title>同频 · 管理员登录</title><link rel="stylesheet" href="/style.css"><script src="/login.js" defer></script></head><body><main class="account-login"><p class="eyebrow">同频 / 管理员后台</p><h1 id="login-title">管理员登录</h1><p>普通成员无需使用此页面，安装 Skill 后即可申请对话。</p><form id="login-form"><label>管理员账户<input id="login-name" required pattern="[a-z][a-z0-9-]{2,31}" autocomplete="username" placeholder="3–32 位小写字母、数字或短横线"></label><label>密码<input id="login-password" type="password" minlength="12" maxlength="128" required autocomplete="current-password"></label><label id="setup-label" class="hidden">初始化码 / 管理员邀请码<input id="login-code" autocomplete="off"></label><p id="setup-help" class="hidden">首次初始化请在服务器上读取 .runtime-lan/admin-setup-code.txt。初始化码只可使用一次；没有默认密码。已有管理员时，请使用管理员提供的邀请码。</p><button class="primary" id="login-submit">登录</button><button type="button" id="register-switch" class="secondary">使用管理员邀请注册</button></form><p id="login-feedback" role="alert"></p></main></body></html>
